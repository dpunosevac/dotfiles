# ---------------------------------------------------------------- prefix ----

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# -------------------------------------------------------------- terminal ----

set -g default-terminal "tmux-256color"
# terminal-features matches the OUTER terminal's TERM: alacritty locally,
# xterm-256color from Moshi on phone/iPad.
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
setw -g mode-keys vi

# Zero delay so Escape in nvim is not swallowed as the start of a key sequence.
set -sg escape-time 0

# Clipboard travels as OSC 52, so copying works identically over SSH/Mosh.
set -g set-clipboard on

# Size to each client independently instead of to the smallest attached one:
# without this, attaching from the iPad letterboxes the Mac window.
setw -g aggressive-resize on

# ---------------------------------------------------------------- panes -----

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind q confirm-before -p "kill pane #P? (y/n)" kill-pane
bind o rotate-window

# --------------------------------------------------------------- windows ----

bind t new-window -c "#{pane_current_path}"
bind [ previous-window
bind ] next-window
bind n choose-window
bind e command-prompt -I "#W" "rename-window '%%'"
bind "{" swap-window -d -t -1
bind "}" swap-window -d -t +1

# -------------------------------------------------------------- sessions ----

bind w choose-tree -Zs

# ------------------------------------------------------------- copy mode ----

# c and p take over copy/paste because [ and ] are window navigation above.
bind c copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ------------------------------------------------------------ key tables ----
# Sticky modes: each binding re-enters its own table, so the mode persists
# until Escape or Enter.

bind r switch-client -T resize
bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize j resize-pane -D 1 \; switch-client -T resize
bind -T resize k resize-pane -U 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

bind m switch-client -T movetab
bind -T movetab h swap-window -d -t -1 \; switch-client -T movetab
bind -T movetab j swap-window -d -t -1 \; switch-client -T movetab
bind -T movetab k swap-window -d -t +1 \; switch-client -T movetab
bind -T movetab l swap-window -d -t +1 \; switch-client -T movetab
bind -T movetab Escape switch-client -T root
bind -T movetab Enter switch-client -T root

# ----------------------------------------------------------------- misc -----

bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------ appearance: panes ----

# Only the foreground is dimmed for inactive panes. Setting an explicit
# background here would make cells opaque and defeat Alacritty's window opacity.
set -g window-style "fg=#565f89"
set -g window-active-style "fg=#c0caf5"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g display-panes-colour "#3b4261"
set -g display-panes-active-colour "#7aa2f7"

set -g message-style "bg=#1a1b26,fg=#e0af68"
set -g mode-style "bg=#3b4261,fg=#c0caf5"

# ----------------------------------------------------- appearance: status ----

set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 1
# bg=default keeps the status bar as translucent as the rest of the window.
set -g status-style "bg=default,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 100

# Left: "LDR" while the prefix is pending, the key table name inside
# resize/movetab, otherwise the session name.
# The key table is tested before client_prefix: tmux reports client_prefix as
# set for any non-root table, so checking it first would hide the table name.
set -g status-left "#{?#{||:#{==:#{client_key_table},resize},#{==:#{client_key_table},movetab}},#[fg=#7dcfff]  #{client_key_table},#{?client_prefix,#[fg=#bb9af7]#[bold]  LDR,#[fg=#f7768e]  #S}} #[none]#[fg=#3b4261]| "

# Right: cwd basename, foreground command, clock.
set -g status-right "#[fg=#7aa2f7]  #{b:pane_current_path} #[fg=#3b4261]| #[fg=#e0af68]  #{pane_current_command} #[fg=#3b4261]| #[fg=#c0caf5]  %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W "
setw -g window-status-activity-style "fg=#e0af68"
